name: Materialize v1.6 OpenSCAD source
on:
  push:
    branches: [main]
    paths:
      - 'src/.payload/**'
      - '.github/workflows/materialize-v1_6.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize standalone source
        shell: bash
        run: |
          cat src/.payload/v1_6.part* | base64 -d | gzip -d > src/cnc_nema_cycloidal_gearbox_pancake_v1_6.scad
      - name: Commit source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cnc_nema_cycloidal_gearbox_pancake_v1_6.scad
          if ! git diff --cached --quiet; then
            git commit -m "Materialize standalone OpenSCAD v1.6 source"
            git push
          fi
