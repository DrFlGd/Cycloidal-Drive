name: Validate presets and render documentation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'web/**'
      - '.github/workflows/render-openscad-docs.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'web/**'
      - '.github/workflows/render-openscad-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Compile every preset x simplification level x input architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
          openscad --version
      - name: Run the validation matrix
        run: python3 tools/validate_presets.py --csv validation_matrix.csv
      - name: Export every part of the default preset as DXF and STL
        run: |
          set -e
          mkdir -p export
          for p in rear_plate case_ring front_pin_plate bearing_race_retainer bearing_carrier cycloid_disc output_face_plate output_hub_ring inner_race_retainer; do
            openscad -o "export/$p.dxf" -D "part=\"$p\"" src/cycloidal_gearbox.scad
            openscad -o "export/$p.stl" -D "part=\"$p\"" -D 'export_mode="3D solid"' src/cycloidal_gearbox.scad
          done
          openscad -o export/eccentric_sleeve.stl -D 'part="eccentric_sleeve"' src/cycloidal_gearbox.scad
          ls -la export
      - uses: actions/upload-artifact@v4
        with:
          name: validation-and-exports
          path: |
            validation_matrix.csv
            export/

  web-generator:
    name: Web generator in headless Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Every Customizer parameter has a place in the web form
        run: python3 tools/check_web_schema.py
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Check, preview and export in the browser
        run: node tools/web_smoke_test.mjs

  render-docs:
    name: Render README images
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSCAD render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb imagemagick
      - name: Render images and motion GIF
        run: tools/render_docs.sh
      - name: Commit rendered documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          if ! git diff --cached --quiet; then
            git commit -m "Render OpenSCAD documentation images"
            git push
          fi
