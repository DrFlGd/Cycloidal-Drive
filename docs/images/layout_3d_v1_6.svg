<style>text{font-family:Arial,sans-serif;fill:#222}.h{font-size:27px;font-weight:700}.s{font-size:16px}.part{fill:#e2e6eb;stroke:#4b5563;stroke-width:2}.rot{fill:#e7b04e;stroke:#6a4a15;stroke-width:2}.out{fill:#6090ba;stroke:#274f72;stroke-width:2}</style>
