<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
<style>text{font-family:Arial,sans-serif;fill:#20242a}.h{font-size:28px;font-weight:700}.s{font-size:18px}.p{stroke:#343a42;stroke-width:3}.stat{fill:#d9dde3}.cyc{fill:#e4aa43}.out{fill:#5487b5}.brg{fill:#b7c1cc}.shaft{fill:#555}</style>
<text x="30" y="38" class="h">Pancake flange-output architecture</text>
<g transform="translate(55 92)"><rect class="stat p" x="0" y="30" width="90" height="230"/><text class="s" x="45" y="292" text-anchor="middle">NEMA motor</text><rect class="shaft" x="90" y="132" width="150" height="24"/><rect class="stat p" x="155" y="20" width="48" height="250"/><text class="s" x="179" y="306" text-anchor="middle">rear</text><rect class="stat p" x="220" y="8" width="150" height="274"/><text class="s" x="295" y="306" text-anchor="middle">case</text><rect class="cyc p" x="260" y="45" width="52" height="200"/><rect class="cyc p" x="316" y="45" width="52" height="200"/><text class="s" x="314" y="333" text-anchor="middle">dual cycloids</text><rect class="stat p" x="385" y="20" width="45" height="250"/><rect class="brg p" x="446" y="38" width="78" height="214"/><text class="s" x="485" y="306" text-anchor="middle">large bearing</text><rect class="out p" x="540" y="18" width="84" height="254"/><text class="s" x="582" y="306" text-anchor="middle">output flange</text></g>
<text class="s" x="500" y="385" text-anchor="middle">Short axial stack: motor → eccentric input → cycloids → output pins → bearing-supported face plate</text></svg>