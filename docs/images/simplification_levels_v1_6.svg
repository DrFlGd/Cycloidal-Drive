<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<style>text{font-family:Arial,sans-serif;fill:#222}.h{font-size:26px;font-weight:700}.s{font-size:17px}.case{fill:#d9dde3;stroke:#40464f;stroke-width:3}.disc{fill:#e4aa43;stroke:#704d12;stroke-width:2}.bearing{fill:#b7c1cc;stroke:#344454;stroke-width:2}.out{fill:#5487b5;stroke:#244c70;stroke-width:3}.ghost{fill:none;stroke:#777;stroke-width:3;stroke-dasharray:8 6}</style>
<text x="30" y="36" class="h">v1.6 simplification levels</text>
<g transform="translate(35 70)"><text x="105" y="-8" text-anchor="middle" class="h">Level 0</text><rect class="case" x="0" y="20" width="210" height="210" rx="18"/><circle class="disc" cx="105" cy="125" r="67"/><circle class="bearing" cx="105" cy="125" r="25"/><circle class="out" cx="105" cy="125" r="12"/><text class="s" x="105" y="258" text-anchor="middle">Full bearings + rollers</text></g>
<g transform="translate(325 70)"><text x="105" y="-8" text-anchor="middle" class="h">Level 1</text><rect class="case" x="0" y="20" width="210" height="210" rx="18"/><circle class="ghost" cx="105" cy="125" r="84"/><circle class="disc" cx="105" cy="125" r="67"/><circle class="bearing" cx="105" cy="125" r="25"/><circle class="out" cx="105" cy="125" r="12"/><text class="s" x="105" y="258" text-anchor="middle">Printed ring ridges</text></g>
<g transform="translate(615 70)"><text x="105" y="-8" text-anchor="middle" class="h">Level 2</text><rect class="case" x="0" y="20" width="210" height="210" rx="18"/><circle class="ghost" cx="105" cy="125" r="84"/><circle class="disc" cx="105" cy="125" r="67"/><circle class="ghost" cx="105" cy="125" r="25"/><circle class="out" cx="105" cy="125" r="12"/><text class="s" x="105" y="258" text-anchor="middle">Direct cams + pins</text></g>
<g transform="translate(905 70)"><text x="105" y="-8" text-anchor="middle" class="h">Level 3</text><rect class="case" x="0" y="20" width="210" height="210" rx="18"/><circle class="ghost" cx="105" cy="125" r="84"/><circle class="disc" cx="105" cy="125" r="67"/><circle class="ghost" cx="105" cy="125" r="25"/><circle class="ghost" cx="105" cy="125" r="13"/><text class="s" x="105" y="258" text-anchor="middle">Printed plain journals</text></g></svg>