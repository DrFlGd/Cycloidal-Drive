<g transform="translate(30 95)"><rect class="node" x="0" y="0" width="170" height="105" rx="16"/><text class="h" x="85" y="43" text-anchor="middle">NEMA shaft</text><text class="s" x="85" y="73" text-anchor="middle">input angle θ</text></g>
<path class="a" d="M205 148 H290"/>
